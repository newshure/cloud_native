{{- if .Values.lease.create -}}
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ .Values.postgresql.leaseName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql-ha.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  leaseDurationSeconds: {{ .Values.postgresql.leaseDurationSec }}
{{- end }}
