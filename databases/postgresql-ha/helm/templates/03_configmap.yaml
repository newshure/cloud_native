apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql-ha.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql-ha.labels" . | nindent 4 }}
data:
  postgresql.conf: |
{{ .Values.config.postgresql | indent 4 }}
  pg_hba.conf: |
{{ .Values.config.pgHba | indent 4 }}
  pg_ident.conf: |
{{ .Values.config.pgIdent | indent 4 }}
