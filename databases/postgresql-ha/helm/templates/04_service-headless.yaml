apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgresql-ha.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql-ha.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: {{ .Values.service.headless.publishNotReadyAddresses }}
  selector:
    {{- include "postgresql-ha.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgresql.port }}
      targetPort: {{ .Values.postgresql.port }}
