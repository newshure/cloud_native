apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgresql-ha.readServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql-ha.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.read.type }}
  selector:
    {{- include "postgresql-ha.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgresql.port }}
      targetPort: {{ .Values.postgresql.port }}
      {{- if and (eq .Values.service.read.type "NodePort") .Values.service.read.nodePort }}
      nodePort: {{ .Values.service.read.nodePort }}
      {{- end }}
