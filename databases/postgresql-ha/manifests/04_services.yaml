apiVersion: v1
kind: Service
metadata:
  name: postgresql-ha-headless-service
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: postgresql-ha
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-ha-read-service
spec:
  type: NodePort
  selector:
    app: postgresql-ha
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30112
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-ha-write-service
spec:
  type: NodePort
  selector:
    app: postgresql-ha
    role: master
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30111
