# =============================================================================
# Trino Secrets — TEMPLATE (placeholders only)
# -----------------------------------------------------------------------------
# 이 파일은 git 안전성을 위해 placeholder 만 유지합니다. 배포 전 envsubst /
# Sealed-Secrets / SOPS / External-Secrets-Operator / Vault 중 하나로 실값 주입.
#
# Placeholders:
#   ${TLS_SERVER_PEM}            : 서버 TLS 인증서 + 개인키 PEM 연결 (들여쓰기 7칸)
#   ${BCRYPT_HASH_ADMIN}         : admin 사용자 bcrypt 해시
#   ${BCRYPT_HASH_HAEDONG}       : haedong 사용자 bcrypt 해시
#   ${BCRYPT_HASH_TRINO}         : trino 사용자 bcrypt 해시
#   ${BCRYPT_HASH_PROMETHEUS}    : prometheus 사용자 bcrypt 해시
#   ${BCRYPT_HASH_CLOUDBEAVER}   : cloudbeaver 사용자 bcrypt 해시
#   ${BCRYPT_HASH_COXSPACE}      : coxspace 사용자 bcrypt 해시
#
# bcrypt 해시 생성 예:
#   htpasswd -nbB <user> '$PASSWORD' | cut -d: -f2
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: trino-cert-secret
  namespace: __NAMESPACE__
  labels:
    app: trino
type: Opaque
stringData:
  server.pem: |
       ${TLS_SERVER_PEM}
---
apiVersion: v1
kind: Secret
metadata:
  name: trino-password-db-secret
  namespace: __NAMESPACE__
  labels:
    app: trino
type: Opaque
stringData:
  password.db: |
       admin:${BCRYPT_HASH_ADMIN}
       haedong:${BCRYPT_HASH_HAEDONG}
       trino:${BCRYPT_HASH_TRINO}
       prometheus:${BCRYPT_HASH_PROMETHEUS}
       cloudbeaver:${BCRYPT_HASH_CLOUDBEAVER}
       coxspace:${BCRYPT_HASH_COXSPACE}
