apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: __NAMESPACE__
  labels:
    app: trino-coordinator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trino-coordinator
  template:
    metadata:
      labels:
        app: trino-coordinator
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: trino-initiator
          image: harbor.nova.office/library/databases/trino:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c", "/opt/trino/bin/init-container.sh"]
          securityContext:
            privileged: true
      containers:
        - name: trino-coordinator
          image: harbor.nova.office/library/databases/trino:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "12Gi"
          env:
            - name: PRODUCT
              value: "production"
            - name: COORDINATOR_ENABLED
              value: "true"
            - name: WORKER_ENABLED
              value: "false"
            - name: TRINO_SERVER_DISCOVERY_URI
              value: "http://trino-coordinator-service:8080"
            - name: METRICS_USER
              value: "prometheus"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          workingDir: /opt/trino
          command: ["/bin/bash", "-c", "/opt/trino/bin/coordinator-container.sh"]
          startupProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/status
              port: 8080
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /v1/info/state
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    curl -s -X PUT \
                      -d '"SHUTTING_DOWN"' \
                      -H 'Content-type: application/json' \
                      -H 'X-Trino-User: admin' \
                      http://localhost:8080/v1/info/state
                    sleep 30
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: trino-coordinator-configmap
              mountPath: /opt/trino/etc/templates
              readOnly: true
            - name: trino-password-db-secret
              mountPath: /opt/trino/etc/password.db
              subPath: password.db
              readOnly: true
            - name: trino-catalog-configmap
              mountPath: /opt/trino/etc/catalog
              readOnly: true
            - name: trino-cert-secret
              mountPath: /opt/trino/etc/certs
              readOnly: true
            - name: trino-coordinator-data-volume
              mountPath: /opt/trino/data
            - name: trino-coordinator-heapdump-volume
              mountPath: /opt/trino/dump
      volumes:
        - name: trino-coordinator-configmap
          configMap:
            name: trino-coordinator-configmap
        - name: trino-catalog-configmap
          configMap:
            name: trino-catalog-configmap
        - name: trino-cert-secret
          secret:
            secretName: trino-cert-secret
        - name: trino-password-db-secret
          secret:
            secretName: trino-password-db-secret
        - name: trino-coordinator-data-volume
          persistentVolumeClaim:
            claimName: trino-coordinator-data-volume
        - name: trino-coordinator-heapdump-volume
          persistentVolumeClaim:
            claimName: trino-coordinator-heapdump-volume
